<style>

  --ok:#34d399;--oks:rgba(16,185,129,.13);--okt:#6ee7b7;--bad:#fb7185;--bads:rgba(244,63,94,.13);--badt:#fda4af;--warn:rgba(245,158,11,.13);--warnt:#fcd34d;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a0d16;--card:#111623;--soft:#171d2d;--line:#232a3b;--ink:#e7eaf3;--muted:#9aa3b8;--faint:#8a94ad;--p:#818cf8;--pt:#a5b4fc;--ps:rgba(99,102,241,.15);
  --ok:#34d399;--oks:rgba(16,185,129,.13);--okt:#6ee7b7;--bad:#fb7185;--bads:rgba(244,63,94,.13);--badt:#fda4af;--warn:rgba(245,158,11,.13);--warnt:#fcd34d;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top svg{width:26px;height:26px;flex:none}.wm{font-weight:800;letter-spacing:-.04em}.wm-2{color:var(--pt)}

.ovs{display:flex;gap:8px;flex-wrap:wrap}

:root[data-size=l] #app{zoom:1.15}

:root[data-font=easy]{--f:"Lexend",ui-sans-serif,system-ui,sans-serif}

:root[data-ov=cream] body::after{background:#ffe9a8}

:root[data-ov=green] body::after{background:#b9efb0}

.dl-btn{display:inline-flex;align-items:center;gap:7px;font:700 15px var(--f);color:#fff;background-image:var(--grad);border:0;border-radius:11px;padding:9px 15px;cursor:pointer;box-shadow:0 8px 18px -8px rgba(99,102,241,.75)}
.dl-btn svg{width:18px;height:18px}

.dl-row{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}

.top small{display:block;color:var(--muted);font-size:12px;line-height:1.2}

li{margin-bottom:5px}

label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}

.vd-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 16px}.vd-row .muted{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px var(--f);color:#fff;background-image:var(--grad);border:0;border-radius:12px;padding:13px 22px;cursor:pointer;box-shadow:0 8px 20px -8px rgba(99,102,241,.7)}

.dl-wrap{overflow-x:auto}

.tp{width:100%;border-collapse:collapse;font-size:15px}

.ans{background:var(--oks);color:var(--okt);border-radius:10px;padding:10px 14px;margin:6px 0 10px}

.board-btn{margin-left:auto}
.cboard{position:fixed;inset:0;z-index:50;background:#1f2a24;color:#f4f1e8;display:flex;flex-direction:column}

.cboard .cb-p{font-weight:700;color:#ffe58a;font-size:1.15em;margin-bottom:.5em}
.cboard li{margin-bottom:.3em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.livebar .ld::before{animation:none}}
.cc-visual{display:grid;gap:14px;margin:12px 0}.cc-visual figure{margin:0}
.cc-dg{border:1px solid var(--line,#e5e7eb);border-radius:14px;padding:6px;background:var(--card,#fff);overflow:hidden;--dg-ink:var(--ink,#111827);--dg-mute:var(--muted,#4b5563);--dg-box:var(--ps,#eef2ff);--dg-line:var(--line,#c3c8d4);--dg-accent:var(--p,#4f46e5)}

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const id = (new URLSearchParams(location.search).get("id") || (location.pathname.match(/\/s\/([A-Za-z0-9]+)$/) || [])[1] || location.hash.slice(1) || "").replace(/[^A-Za-z0-9]/g, "");
const api = (a, body) => fetch("share.php?a=" + a + (body ? "" : "&id=" + encodeURIComponent(id)), body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {}).then(async r => ({ok: r.ok, status: r.status, json: await r.json().catch(() => ({}))}));
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const fileUrl = (f, slot) => "share.php?a=file&k=" + encodeURIComponent(f.key) + "&f=" + encodeURIComponent(slot);
const kind = n => /pptx$/.test(n) ? "PPTX" : "DOCX";
function setDownloads(groups){
  const box = $("#dlm"), menu = $("#dlMenu"), btn = $("#dlBtn");
  const gs = (groups || []).filter(g => g.files && g.files.key && (g.files.list || []).length);
  if(!gs.length){ box.hidden = true; return; }
  menu.innerHTML = gs.map(g => `${g.head ? `<h4>${esc(g.head)}</h4>` : ""}${g.files.list.map(x => `<a href="${fileUrl(g.files, x.slot)}" download="${esc(x.name)}">${esc(x.label)}<span>${kind(x.name)}</span></a>`).join("")}`).join("");
  box.hidden = false;
  btn.onclick = e => { e.stopPropagation(); const ap = $("#aaPanel"); if(ap){ ap.hidden = true; $("#aaBtn").setAttribute("aria-expanded", "false"); } const open = menu.hidden; menu.hidden = !open; btn.setAttribute("aria-expanded", open); };
  document.addEventListener("click", e => { if(!e.target.closest("#dlm")){ menu.hidden = true; btn.setAttribute("aria-expanded", "false"); } });
  document.addEventListener("keydown", e => { if(e.key === "Escape"){ menu.hidden = true; btn.setAttribute("aria-expanded", "false"); } });
}
const dlRow = f => f && f.key && (f.list || []).length ? `<div class="dl-row">${f.list.map(x => `<a href="${fileUrl(f, x.slot)}" download="${esc(x.name)}">${esc(x.label)}</a>`).join("")}</div>` : "";
/* floating nav: jump to the lesson or unit, the objectives, the tasks and the deadlines */
let openLatest = null, navKind = "";
const NAV = [["top", ""], ["obj", "Learning objectives"], ["tasks", "Tasks"], ["dl", "Deadlines"]];
function setNav(kind, hasDl){
  navKind = kind; const nav = $("#fnav");
  const items = NAV.filter(([k]) => k !== "dl" || hasDl).filter(([k]) => kind === "unit" || k === "top" || document.querySelector(`[data-sec="${k}"]`));
  nav.innerHTML = items.map(([k, l]) => `<button type="button" data-go="${k}">${k === "top" ? (kind === "unit" ? "Unit" : "Lesson") : k === "obj" ? `<span class="l-long">${l}</span><span class="l-short">Objectives</span>` : l}</button>`).join("");
  nav.hidden = items.length < 2; document.body.classList.toggle("has-nav", !nav.hidden); syncNav();
}
const visSec = k => [...document.querySelectorAll(`[data-sec="${k}"]`)].filter(e => e.getClientRects().length);
function navTarget(k){
  let v = visSec(k);
  if(!v.length && navKind === "unit" && openLatest && k !== "dl"){ openLatest(); v = visSec(k); }
  if(!v.length) return null;
  if(navKind !== "unit") return v[0];
  return v.find(e => e.getBoundingClientRect().top > 24) || v[0];   // in a unit, tapping again steps on to the next open lesson
}
function syncNav(){
  const nav = $("#fnav"); if(!nav || nav.hidden) return;
  const mid = innerHeight * 0.35; let cur = "top", best = -Infinity;
  NAV.forEach(([k]) => visSec(k).forEach(e => { const t = e.getBoundingClientRect().top; if(t <= mid && t > best){ best = t; cur = k; } }));
  if(scrollY < 40) cur = "top";
  if(navKind === "lesson" && innerHeight + scrollY >= document.documentElement.scrollHeight - 4 && visSec("dl").length) cur = "dl";
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.go === cur ? "true" : "false"));
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if(!b) return;
  const k = b.dataset.go;
  if(k === "top"){ scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const t = navTarget(k); if(!t) return;
  scrollTo({top: t.getBoundingClientRect().top + scrollY - 16, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
});
addEventListener("scroll", () => requestAnimationFrame(syncNav), {passive: true});
const grade = c => /D\d/.test(c) ? "t-d" : /M\d/.test(c) ? "t-m" : "t-p";
const list = (a, cls) => (a && a.length) ? `<${cls === "ol" ? "ol" : "ul"}${cls && cls !== "ol" ? ` class="${cls}"` : ""}>${a.map(x => `<li>${esc(x)}</li>`).join("")}</${cls === "ol" ? "ol" : "ul"}>` : "";

function lessonBody(L){
  const o = L.objectives || {};
  return `
    ${o.all ? `<h3 data-sec="obj" data-part="objectives">Learning objectives</h3><div class="obj"><span class="tag t-p">All</span><span>${esc(o.all)}</span>${o.most ? `<span class="tag t-m">Most</span><span>${esc(o.most)}</span>` : ""}${o.some ? `<span class="tag t-d">Some</span><span>${esc(o.some)}</span>` : ""}</div>` : ""}
    ${L.starter && L.starter.prompt ? `<h3 data-part="starter">Starter: ${esc(L.starter.title)}</h3><div class="prompt">${esc(L.starter.prompt)}</div>${list(L.starter.instructions)}` : ""}
    ${(L.plan || []).length ? `<h3 data-part="plan">The lesson plan</h3><ul class="plan">${L.plan.map(r => `<li><b>${esc(r.time)}</b><span>${esc(r.what)}</span></li>`).join("")}</ul>` : ""}
    ${(L.howTo || []).length ? `<h3>How to work</h3>${list(L.howTo)}` : ""}
    ${(L.resources || []).length ? `<h3 data-part="res">Resources</h3><div class="res-row">${L.resources.map(r => `<a class="res-a" href="${esc(r.url)}" target="_blank" rel="noopener">${r.img ? `<img src="${esc(r.url)}" alt="">` : ""}<span>${esc(r.kind)}</span>${esc(r.title)}</a>`).join("")}</div>` : ""}
    ${(L.teach || []).length ? `<h3 data-sec="learn" data-part="teach">What you need to know</h3>${L.teach.map((t, i) => `<div class="task learn" data-teach="${i}">
      <div class="task-h"><span class="num">Part ${i + 1}</span><h4>${esc(t.title)}</h4></div>
      ${t.explain ? `<p class="learn-p">${esc(t.explain)}</p>` : ""}
      ${window.ccVisualHtml ? ccVisualHtml(t) : ""}
      ${(t.points || []).length ? `<div class="small"><b>Key points</b>${list(t.points)}</div>` : ""}
      ${(t.terms || []).length ? `<dl class="terms">${t.terms.map(k => `<div><dt>${esc(k.term)}</dt><dd>${esc(k.meaning)}</dd></div>`).join("")}</dl>` : ""}
      ${t.example ? `<div class="goal"><b>Example:</b> ${esc(t.example)}</div>` : ""}
      ${t.ask ? `<p class="small tip" style="margin-bottom:0"><b>Check yourself:</b> ${esc(t.ask)}</p>` : ""}
    </div>`).join("")}` : ""}
    ${(L.tasks || []).length ? `<h3 data-sec="tasks" data-part="tasks">Tasks</h3><div class="tasks-grid">${L.tasks.map((t, i) => `<div class="task" data-task="${i}">
      <div class="task-h"><span class="num">Task ${i + 1}</span><h4>${esc(t.title)}</h4>${t.mins ? `<span class="mins">${esc(t.mins)} min</span>` : ""}</div>
      ${t.goal ? `<div class="goal"><b>You will produce:</b> ${esc(t.goal)}</div>` : ""}
      ${(t.steps || []).length ? `<ol class="steps">${t.steps.map((s, j) => `<li data-si="${j}" tabindex="0" role="checkbox" aria-checked="false">${esc(s)}</li>`).join("")}</ol>` : ""}
      ${(t.check || []).length ? `<div class="small"><b>Check before you move on</b>${list(t.check, "check")}</div>` : ""}
      ${t.tip ? `<p class="small tip"><b>Tip:</b> ${esc(t.tip)}</p>` : ""}${t.stretch ? `<p class="small stretch"><b>Stretch:</b> ${esc(t.stretch)}</p>` : ""}
      <button type="button" class="fin" data-fin="${i}" aria-pressed="false">I've finished this task</button>
    </div>`).join("")}</div>` : (L.steps || []).length ? `<h3 data-sec="tasks">Today's task</h3>${list(L.steps, "ol")}` : ""}
    ${(L.doneBy || []).length ? `<h3>Done by the end of the lesson</h3>${list(L.doneBy, "check")}` : ""}
    ${L.study ? `<h3>Independent study${L.study.mins ? ` · about ${esc(L.study.mins)} minutes` : ""}</h3><div class="task"><h4 style="margin:0 0 6px">${esc(L.study.title)}</h4>
      ${L.study.goal ? `<div class="goal"><b>You will produce:</b> ${esc(L.study.goal)}</div>` : ""}${list(L.study.steps, "ol")}
      ${(L.study.sources || []).length ? `<div class="small"><b>Where to look</b>${list(L.study.sources)}</div>` : ""}
      ${L.study.bring ? `<p class="small"><b>Bring next lesson:</b> ${esc(L.study.bring)}</p>` : ""}${L.study.stretch ? `<p class="small stretch"><b>Stretch:</b> ${esc(L.study.stretch)}</p>` : ""}</div>` : ""}`;
}
const today = (() => { const n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); })();
const day = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"}) : "";
const daysTo = iso => Math.round((new Date(iso + "T00:00:00") - new Date(today + "T00:00:00")) / 864e5);
const ymd = iso => iso.replace(/-/g, "");
const dayAfter = iso => { const t = new Date(iso + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + 1); return t.toISOString().slice(0, 10); };
function calEvents(list){ return (list || []).flatMap(a => [[a.due, a.name + " hand-in", a.title], [a.resub, a.name + " resubmission", a.title]]).filter(x => x[0] && x[0] >= today); }
function icsText(list, unit){
  const E = s => String(s || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\r?\n/g, "\\n");
  const fold = l => { const out = []; while(l.length > 74){ out.push(l.slice(0, 74)); l = " " + l.slice(74); } out.push(l); return out.join("\r\n"); };
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Crafticulum//Deadlines//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:" + E(unit ? "Deadlines: " + unit : "Assignment deadlines")];
  calEvents(list).forEach(([d, what, title], i) => lines.push("BEGIN:VEVENT", "UID:" + ymd(d) + "-" + i + "-" + (id || "cc") + "@course-creator", "DTSTAMP:" + stamp, "DTSTART;VALUE=DATE:" + ymd(d), "DTEND;VALUE=DATE:" + ymd(dayAfter(d)),
    "SUMMARY:" + E(what), "DESCRIPTION:" + E((title ? title + ". " : "") + (unit ? unit + ". " : "") + "Your lesson page: " + location.href), "TRANSP:TRANSPARENT",
    "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + E(what + " in 3 days"), "TRIGGER:-P3D", "END:VALARM",
    "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + E(what + " tomorrow"), "TRIGGER:-PT15H", "END:VALARM", "END:VEVENT"));
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}
const gcalUrl = (d, what, title, unit) => "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(what) + "&dates=" + ymd(d) + "/" + ymd(dayAfter(d)) + "&details=" + encodeURIComponent((title ? title + ". " : "") + (unit ? unit + ". " : "") + location.href);
const CALI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>';
function deadlines(list, unit){
  if(!(list || []).length) return "";
  const evs = calEvents(list), ics = evs.length ? "data:text/calendar;charset=utf-8," + encodeURIComponent(icsText(list, unit)) : "";
  const next = list.flatMap(a => [[a.due, a.name + " hand-in"], [a.resub, a.name + " resubmission"]]).filter(x => x[0] && x[0] >= today).sort((a, b) => a[0] < b[0] ? -1 : 1)[0];
  return `<div class="card" data-sec="dl">${next ? `<div class="next"><span>Next deadline</span><b>${esc(next[1])}</b><em>${day(next[0])}${daysTo(next[0]) === 0 ? " · today" : daysTo(next[0]) === 1 ? " · tomorrow" : ` · in ${daysTo(next[0])} days`}</em></div>` : ""}
    <h2>Assignment dates</h2>${evs.length ? `<div class="cal-acts"><a class="cal-btn" href="${ics}" download="${esc((unit || "Assignment").replace(/[^A-Za-z0-9 ]+/g, " ").trim())} deadlines.ics">${CALI}Add deadlines to my calendar</a></div><p class="muted small" style="margin-top:-6px">Works with Outlook, Apple Calendar and Google Calendar, with a reminder 3 days before and the day before. Or add one at a time to Google below.</p>` : ""}<div class="dl-wrap"><table class="dl"><thead><tr><th>Assignment</th><th>Handed out</th><th>Hand in by</th><th>Resubmission</th></tr></thead><tbody>
    ${list.map(a => `<tr><td><b>${esc(a.name)}</b><br><span class="muted small">${esc(a.title)}</span></td><td>${day(a.out) || "Not set"}</td><td class="${a.due && a.due < today ? "past" : ""}">${day(a.due) || "Not set"}${a.due && a.due >= today ? `<br><a class="gcal" href="${gcalUrl(a.due, a.name + " hand-in", a.title, unit)}" target="_blank" rel="noopener">+ Google Calendar</a>` : ""}</td><td>${day(a.resub) || "-"}${a.resub && a.resub >= today ? `<br><a class="gcal" href="${gcalUrl(a.resub, a.name + " resubmission", a.title, unit)}" target="_blank" rel="noopener">+ Google Calendar</a>` : ""}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function heroHtml(kick, title, sub, chips){
  return `<div class="card hero" data-sec="top"><div class="kick">${esc(kick)}</div><h1>${esc(title)}</h1>${sub ? `<div class="muted">${esc(sub)}</div>` : ""}${(chips || []).length ? `<div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>` : ""}</div>`;
}
function showLesson(L){
  document.title = L.title + " · Crafticulum"; $("#sub").textContent = "Lesson"; setDownloads([{files: L.files}]);
  setTimeout(() => setNav("lesson", !!(L.assignments || []).length), 0);
  $("#app").innerHTML = heroHtml(`${L.course || ""} · ${L.level || ""}${L.length ? " · " + L.length : ""}`, L.title, L.unit, L.criteria) + (window.ccVideo && ((L.teach || []).length || (L.tasks || []).length) ? `<div class="vd-row"><button type="button" class="btn" id="vdWatch"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>Watch the video lesson</button><span class="muted">Crafti talks you through it, slide by slide.</span></div>` : "") + `<div class="card" data-live="${esc(L.live || id)}">${lessonBody(L)}</div>` + deadlines(L.assignments, L.unit);
  paintTicks();
  liveWatch([L.live]);
  const vw = document.getElementById("vdWatch"); if(vw) vw.onclick = () => ccVideo.open(L, {student: true, script: (L.video && L.video.script) || {}, note: "Crafti reads the lesson out using your device's own voice."});
}
function showUnit(U){
  document.title = U.unit + " · Crafticulum"; $("#sub").textContent = "Unit lessons";
  setDownloads((U.lessons || []).slice().reverse().map(L => ({head: `Week ${L.week} · ${L.title}`, files: L.files})));
  const weeks = []; (U.lessons || []).forEach(L => { const w = weeks.find(x => x.week === L.week); if(w) w.items.push(L); else weeks.push({week: L.week, wc: L.wc, items: [L]}); });
  const open = new Set([weeks.length ? weeks[weeks.length - 1].week : 0]);

      `<div class="card"><div class="cls-stats"><div><b>${lessons.length}</b><span>lessons</span></div><div><b>${nDone}</b><span>finished</span></div><div><b>${nSc} of ${tests.length}</b><span>quizzes done</span></div></div></div>` +
      (tests.length ? `<div class="card"><h2 style="margin-top:0">Quizzes and assessments</h2>${tests.map(T => { const sc = scores[T.id]; return `<a class="cls-row" href="student.html?id=${esc(T.id)}&c=${esc(id)}"><span class="cls-main"><b>${esc(T.title)}</b><small>${esc(T.unit || "")} · ${day(T.at)}</small></span>${sc ? `<span class="cls-pill ok">${sc.score} / ${sc.of}</span>` : `<span class="cls-pill">To do</span>`}</a>`; }).join("")}</div>` : "") +
      `<div class="card"><h2 style="margin-top:0">Lessons</h2>${lessons.length ? lessons.map(L => { const d = done(L), all = L.tasks && d >= L.tasks; return `<a class="cls-row" href="student.html?id=${esc(L.id)}&c=${esc(id)}"><span class="cls-main"><b>${esc(L.title)}</b><small>${esc(L.unit || "")} · ${day(L.at)}</small></span>${L.tasks ? `<span class="cls-pill${all ? " ok" : ""}">${all ? "Finished" : d ? `${d} of ${L.tasks} tasks` : "Not started"}</span>` : ""}</a>`; }).join("") : `<p class="muted" style="margin:0">Nothing has been shared yet. Check back after your next lesson.</p>`}</div>` +
      `<p class="muted" style="text-align:center;font-size:13px">Your progress and scores are kept on this device. Use the same phone or computer to see them again.</p>`;
    const f = $("#clsWho"); if(f) f.onsubmit = e => { e.preventDefault(); const v = ($("#clsName").value || "").trim().slice(0, 30); if(!v) return; who = v; try{ localStorage.setItem("cc_who", who); if(!localStorage.getItem("cc_name")) localStorage.setItem("cc_name", who); }catch{} draw(); };
  };
  draw();
}
function askCode(msg){
  let last = ""; try{ last = localStorage.getItem("cc_class") || ""; }catch{}
  $("#sub").textContent = ""; $("#app").innerHTML = `<form class="card" id="codeForm"><h2 style="margin-top:0">Enter your class code</h2><p class="muted">Your teacher has the code. It's on the class page link or QR code.</p><div class="who-row"><input id="codeIn" maxlength="24" placeholder="Class code" autocapitalize="off" autocomplete="off" spellcheck="false" required><button type="submit" class="go">Open</button></div>${msg ? `<p class="muted" style="color:#b91c1c;margin-bottom:0">${esc(msg)}</p>` : ""}${last ? `<p style="margin:14px 0 0"><a href="student.html?id=${esc(last)}">Go to my class page</a></p>` : ""}</form>`;
  $("#codeForm").onsubmit = e => { e.preventDefault(); const v = ($("#codeIn").value || "").replace(/[^A-Za-z0-9]/g, ""); if(v) location.href = "student.html?id=" + v; };
}
async function boot(){
  if(!id){ askCode(""); return; }
  try{
    const r = await api("get");
    if(!r.ok){ $("#sub").textContent = ""; $("#app").innerHTML = `<div class="card"><h2>${r.status === 404 ? "This link has stopped working" : "Couldn't open this page"}</h2><p class="muted">${r.status === 404 ? "Your teacher may have stopped sharing it. Ask them for a new link." : "Check your internet and refresh the page."}</p></div>`; return; }
    const {kind, data} = r.json;
    try{ const st = r.json.site; if(st){ const top = document.querySelector(".top"); if(st.name) top.querySelector("b").textContent = st.name;
      if(st.logo){ const sv = top.querySelector("svg"); if(sv){ const im = new Image(); im.src = st.logo; im.alt = ""; im.className = "site-logo"; sv.replaceWith(im); } }
      if(/^#[0-9a-f]{6}$/i.test(st.color || "")){ const d = document.documentElement.style; d.setProperty("--p", st.color); d.setProperty("--pt", `color-mix(in srgb,${st.color} 78%,var(--ink))`); d.setProperty("--ps", `color-mix(in srgb,${st.color} 12%,transparent)`); } } }catch{}
    if(kind === "cover") showCover(data); else if(kind === "lesson") showLesson(data); else if(kind === "unit") showUnit(data); else if(kind === "test") showTest(data); else if(kind === "class") showClass(data);
    if(kind === "lesson" || kind === "test") backToClass();
  }catch{ $("#app").innerHTML = `<div class="card"><h2>Couldn't open this page</h2><p class="muted">Check your internet and refresh the page.</p></div>`; }
}
/* reading options: theme, text size, easy read font and a colour overlay, remembered on this device */
(function(){
  const root = document.documentElement, btn = $("#aaBtn"), panel = $("#aaPanel");
  let a = {}; try{ a = JSON.parse(localStorage.getItem("cc_read") || "{}") || {}; }catch{}
  const paint = () => { ["theme", "size", "font", "ov"].forEach(k => { if(a[k]) root.dataset[k] = a[k]; else delete root.dataset[k]; });
    panel.querySelectorAll("[data-aa][data-v]").forEach(b => b.setAttribute("aria-pressed", (a[b.dataset.aa] || "") === b.dataset.v)); };
  const save = () => { try{ localStorage.setItem("cc_read", JSON.stringify(a)); }catch{} };
  const open = on => { panel.hidden = !on; btn.setAttribute("aria-expanded", on); if(on){ const f = panel.querySelector('[aria-pressed="true"]') || panel.querySelector("button"); f.focus(); } };
  btn.onclick = e => { e.stopPropagation(); const dm = $("#dlMenu"); if(dm) dm.hidden = true; open(panel.hidden); };
  panel.onclick = e => { e.stopPropagation(); const b = e.target.closest("[data-aa]"); if(!b) return; if(b.dataset.aa === "reset") a = {}; else a[b.dataset.aa] = b.dataset.v; paint(); save(); };
  document.addEventListener("click", e => { if(!e.target.closest("#aa")) open(false); });
  document.addEventListener("keydown", e => { if(e.key === "Escape" && !panel.hidden){ open(false); btn.focus(); } });
  paint();
})();
boot();
})();
</script>
