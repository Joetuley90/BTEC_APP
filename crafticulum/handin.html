<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand in your work · Crafticulum</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.ico?v=5" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<style>
:root{color-scheme:light dark;--p:#4f46e5;--ink:#0f172a;--soft:#475569;--line:#e2e8f0;--bg:#f5f6fa;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#f1f5f9;--soft:#cbd5e1;--line:#334155;--bg:#0a0d16;--card:#131826;--p:#818cf8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;letter-spacing:-.04em;margin-bottom:22px}.brand svg{width:30px;height:30px}.brand span span{color:var(--p)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
h1{font-size:1.45rem;line-height:1.25;margin:0 0 4px;letter-spacing:-.02em}.sub{color:var(--soft);margin:0 0 18px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
input[type=text],input[type=file]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--p) 45%,transparent);outline-offset:2px}
button{margin-top:18px;width:100%;font:inherit;font-weight:700;padding:13px;border:0;border-radius:10px;background:var(--p);color:#fff;cursor:pointer}button[disabled]{opacity:.55;cursor:default}
.hint{font-size:.84rem;color:var(--soft);margin:6px 0 0}.msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.95rem}.bad{background:#fee2e2;color:#7f1d1d}.good{background:#dcfce7;color:#14532d}
.small{font-size:.82rem;color:var(--soft);margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M22 8 H64 V36 H36 V64 H92 V78 Q92 92 78 92 H22 Q8 92 8 78 V22 Q8 8 22 8 Z" fill="#4f46e5"/><path d="M64 8 L92 36 H64 Z" fill="#a5b4fc"/></svg><span>craft<span>iculum</span></span></div>
  <div class="card" id="card"><h1 id="h">Loading...</h1><p class="sub" id="sub"></p><div id="body"></div></div>
  <p class="small" id="foot"></p>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const code = (new URLSearchParams(location.search).get("c") || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const WHY = {number: "Type your learner number, not your name. Ask your teacher if you don't know it.", name: "Type your name so your teacher knows whose work this is.", file: "Choose the file you want to hand in.", big: "That file is too big.", type: "That kind of file can't be handed in here.", closed: "This hand-in has closed. Speak to your teacher.", full: "This hand-in can't take any more files. Speak to your teacher.", slow: "Too many files from here in the last hour. Try again later.", not_found: "This link doesn't work any more. Ask your teacher for a new one."};
  const gone = t => { $("#h").textContent = "This link isn't open"; $("#sub").textContent = t; $("#body").innerHTML = ""; };
  if(code.length !== 12) return gone(WHY.not_found);
  fetch("handin.php?a=info&c=" + code).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(i => {
    $("#h").textContent = i.title; $("#sub").textContent = [i.college, i.group].filter(Boolean).join(" · ");
    if(!i.open) return gone(WHY.closed);
    document.title = "Hand in: " + i.title;
    $("#body").innerHTML = `<form id="f" novalidate><label for="n">${i.anon ? "Your learner number" : "Your name"}</label><input type="text" id="n" maxlength="${i.anon ? 16 : 60}" autocomplete="${i.anon ? "off" : "name"}" ${i.anon ? 'inputmode="text" placeholder="e.g. 204518 or Learner 07"' : ""} required>${i.anon ? `<p class="hint">Your college keeps learners anonymous. Use your number, and leave your name off the file if you can.</p>` : ""}
      <label for="file">Your file</label><input type="file" id="file" required accept="${i.types.map(t => "." + t).join(",")}"><p class="hint">Up to ${i.max} MB. ${esc(i.types.join(", "))}.</p>
      <button type="submit" id="go">Hand in</button><div id="m" role="status" aria-live="polite"></div></form>`;
    $("#foot").textContent = `Your file goes to your teacher. It is kept for ${i.days} days and then deleted.${i.closes ? " This hand-in closes on " + new Date(i.closes * 1000).toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long"}) + "." : ""}`;
    $("#f").addEventListener("submit", async e => { e.preventDefault(); const say = (t, good) => { $("#m").className = "msg " + (good ? "good" : "bad"); $("#m").textContent = t; };
      const name = $("#n").value.trim(), file = $("#file").files[0]; if(name.length < 2) return say(i.anon ? WHY.number : WHY.name); if(!file) return say(WHY.file); if(file.size > i.max * 1048576) return say(WHY.big + " The most is " + i.max + " MB.");
      const fd = new FormData(); fd.append("c", code); fd.append("name", name); fd.append("file", file); $("#go").disabled = true; $("#go").textContent = "Sending...";
      try{ const r = await fetch("handin.php?a=send", {method: "POST", body: fd}); let j = {}; try{ j = await r.json(); }catch{}
        if(!r.ok) throw j.error || "x";
        $("#body").innerHTML = `<div class="msg good"><b>Handed in.</b> ${esc(file.name)} has gone to your teacher. Your reference is <b>${esc(j.ref)}</b>. Take a screenshot if you want proof.</div><button type="button" id="again">Hand in another file</button>`; $("#again").onclick = () => location.reload();
      }catch(err){ say(WHY[err] || "That didn't send. Check your connection and try again."); $("#go").disabled = false; $("#go").textContent = "Hand in"; } });
  }).catch(() => gone(WHY.not_found));
})();
</script>
</body>
</html>
