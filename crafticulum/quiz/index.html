<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="../favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="Crafticulum">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Exit Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Figtree:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="marks.js?v=2" defer></script>
<style>
:root{--slate:#26382e;--slate-2:#1f2f26;--wood:#7a5233;--wood-2:#5a3a22;--chalk:#f1eee4;--dim:#c9cfc3;--y:#f6e7a1;--p:#f5b0c4;--b:#aedcf2;--g:#c3ecb0;
  --chalkf:"Kalam","Comic Sans MS","Segoe Print",cursive;--body:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--slate),var(--slate-2));color:var(--chalk);font-family:var(--chalkf);min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.phone{max-width:560px}
.kick{color:var(--b);font-weight:700;font-size:16px}
h1{font-size:clamp(28px,4vw,52px);line-height:1.05;margin:4px 0 16px;border-bottom:3px dashed rgba(241,238,228,.5);display:inline-block;padding-bottom:6px}
h2{font-size:24px;color:var(--y);margin:22px 0 10px}
p{font-size:18px;line-height:1.4}
.note{font-family:var(--body);font-size:13px;color:var(--dim);line-height:1.45}
.btn{background:transparent;color:var(--chalk);border:2px solid rgba(241,238,228,.6);border-radius:10px;font:700 18px var(--chalkf);padding:10px 18px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.big{border-color:var(--y);color:var(--y);font-size:22px}
.btn.end{border-color:var(--p);color:var(--p)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
input.ini{width:100%;font:700 40px var(--chalkf);letter-spacing:.3em;text-transform:uppercase;text-align:center;background:rgba(0,0,0,.2);color:var(--chalk);border:2px solid rgba(241,238,228,.5);border-radius:12px;padding:12px}
.q{border:2px dashed rgba(241,238,228,.35);border-radius:12px;padding:14px;margin:14px 0}
.q p{margin:0 0 10px;font-weight:700;font-size:20px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:rgba(0,0,0,.18);color:var(--chalk);border:2px solid rgba(241,238,228,.4);border-radius:10px;padding:12px;font:700 18px var(--chalkf);cursor:pointer}
.opt b{color:var(--y);min-width:1.2em}
.opt.sel{border-color:var(--b);background:rgba(174,220,242,.15)}
.opt.right{border-color:var(--g);color:var(--g)}
.opt.wrong{border-color:var(--p);color:var(--p)}
.why{color:var(--dim);font-size:16px;margin-top:8px}
.score{font-size:30px;color:var(--y);text-align:center;margin:18px 0 6px}
/* host */
.host{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}
@media (max-width:820px){.host{grid-template-columns:1fr}}
.qr{background:#f7f5ee;border-radius:10px;padding:14px}
.qr img,.qr canvas{display:block;width:100%!important;height:auto!important}
.code{font:700 28px var(--chalkf);color:var(--y);text-align:center;letter-spacing:.08em;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:2px solid rgba(195,236,176,.6);color:var(--g);border-radius:999px;padding:2px 12px;font-weight:700}
.count{font-size:64px;line-height:1;font-weight:700;color:var(--g)}
.bar{display:grid;grid-template-columns:2.2em 1fr 3em;gap:8px;align-items:center;margin:4px 0;font-size:17px}
.bar .t{height:18px;border-radius:6px;background:rgba(241,238,228,.12);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--dim)}
.bar.ok .t i{background:var(--g)}.bar.ok b{color:var(--g)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;font-size:18px;min-width:100%}
th,td{padding:6px 10px;border-bottom:1px dashed rgba(241,238,228,.3);text-align:center}
th:first-child,td:first-child{text-align:left}
td.y{color:var(--g)}td.n{color:var(--p)}
.callout{border:2px solid var(--p);border-radius:12px;padding:12px 16px;margin:14px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--p)}
/* the class board: results with made-up names */
.cls{max-width:1500px}
.cls h1{font-size:clamp(34px,5vw,72px)}
.cls h2{font-size:clamp(24px,2.6vw,40px);margin:34px 0 12px}
.cls p,.cls li{font-size:clamp(18px,1.7vw,28px);line-height:1.35}
.stats{display:flex;flex-wrap:wrap;gap:16px 48px;margin:8px 0 6px}
.stats .count{font-size:clamp(52px,7vw,104px)}
.stats .note{font-size:clamp(13px,1.2vw,18px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px 48px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.spread{display:flex;align-items:flex-end;gap:8px;height:clamp(150px,22vh,260px);border-bottom:2px solid rgba(241,238,228,.4);padding-top:1.6em}
.spread .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.spread .col i{display:block;width:100%;max-width:90px;background:var(--b);border-radius:4px 4px 0 0;min-height:0}
.spread .col.top i{background:var(--g)}
.spread .col span{font-size:clamp(15px,1.5vw,24px);font-weight:700;margin-bottom:2px}
.spread-x{display:flex;gap:8px}.spread-x b{flex:1;text-align:center;font-size:clamp(14px,1.3vw,22px);color:var(--dim);padding-top:4px}
.lead{list-style:none;margin:0;padding:0}
.lead li{display:grid;grid-template-columns:2em 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(241,238,228,.3)}
.lead li b:first-child{color:var(--dim)}
.lead li:nth-child(-n+3) .nm{color:var(--y)}
.lead .sc{font-weight:700;color:var(--g)}
.miss{border:2px solid var(--p);border-radius:14px;padding:14px 18px;margin:14px 0}
.miss .hd{display:flex;gap:14px;justify-content:space-between;align-items:baseline}
.miss .hd b{font-size:clamp(20px,2vw,32px)}
.miss .pc{color:var(--p);font-weight:700;white-space:nowrap;font-size:clamp(20px,2vw,32px)}
.miss .slip{color:var(--dim)}.miss .ans{color:var(--g);font-weight:700}
.tips{border:2px solid var(--y);border-radius:14px;padding:6px 22px 10px 2.6em;margin:10px 0}
.tips li{margin:10px 0}
.tips li::marker{color:var(--y);font-weight:700}
.clsbar{display:flex;gap:10px;flex-wrap:wrap;padding:12px 0;margin-top:26px;}
.clsbar .btn{font-size:16px;padding:7px 14px}
.you{border:2px solid var(--b);border-radius:12px;padding:10px 14px;text-align:center;margin:8px 0 16px}
.you b{color:var(--y);font-size:24px;display:block}
@media print{.clsbar{display:none}body{background:#fff;color:#111}}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s infinite alternate}@keyframes pulse{from{opacity:.55}to{opacity:1}}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="kick">Exit quiz</div><h1>Loading...</h1></div>
<script>
const API = "api.php";
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = "ABCD";
const params = new URLSearchParams(location.search);
async function api(a, body, q){
  const r = await fetch(API + "?a=" + a + (q || ""), body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {cache:"no-store"});
  let j = {}; try{ j = await r.json(); }catch{}
  return {status: r.status, ...j};
}
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>b.toString(16).padStart(2,"0")).join("");
/* the made-up names on the class board: the server hands each phone a number, and both ends turn it into the same name */
const AL_A = ["Brave","Calm","Clever","Cosmic","Daring","Eager","Fearless","Gentle","Golden","Happy","Jolly","Keen","Lucky","Mighty","Nimble","Plucky","Quick","Quiet","Rapid","Sharp","Sunny","Swift","Witty","Zesty"];
const AL_B = ["Otter","Falcon","Badger","Dolphin","Fox","Heron","Lynx","Owl","Panda","Puffin","Raven","Robin","Seal","Tiger","Turtle","Wolf","Hare","Koala","Gecko","Hawk","Moose","Orca","Stag","Wren"];
const aliasName = n => Number.isInteger(n) && n >= 0 && n < 576 ? AL_A[n % 24] + " " + AL_B[Math.floor(n / 24)] : "";
function b64urlDecode(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0))); }

/* ---------------- student ---------------- */
async function student(room){
  const tokKey = "qr_tok_" + room, resKey = "qr_res_" + room;
  let token = sessionStorage.getItem(tokKey); if(!token){ token = rand(12); sessionStorage.setItem(tokKey, token); }
  let quiz = null, initials = sessionStorage.getItem("qr_ini") || "", picks = [], result = null, waitT = null;
  try{ result = JSON.parse(sessionStorage.getItem(resKey) || "null"); }catch{}
  $app.classList.add("phone");

  const showResult = () => {
    $app.innerHTML = `<div class="kick">Exit quiz · ${esc(initials)}</div><h1>${esc(quiz ? quiz.title : "Exit quiz")}</h1>
      <div class="score">You got ${result.score} out of ${result.total}</div>
      ${aliasName(result.alias) ? `<div class="you" id="you">If your teacher shows the results, you're <b>${esc(aliasName(result.alias))}</b>Only you know that's you. Your initials never go on the board.</div>` : ""}
      ${quiz ? quiz.questions.map((q,i)=>{ const r = result.results[i] || {}, p = picks[i]; return `<div class="q"><p>${i+1}. ${esc(q.q)}</p><div class="opts">
        ${q.options.map((o,j)=>`<div class="opt ${j===r.answer?"right":""} ${p===j&&j!==r.answer?"wrong":""}"><b>${L[j]}</b><span>${esc(o)}</span></div>`).join("")}</div>
        ${r.why?`<div class="why">${r.correct?"Correct. ":"Not quite. "}${esc(r.why)}</div>`:""}</div>`; }).join("") : ""}
      <p style="text-align:center">Sent to your teacher. You can close this tab.</p>
      <p class="note" style="text-align:center">Your teacher sees your initials and answers until they end the quiz, then they're deleted from the server.</p>`;
  };
  const askInitials = () => {
    $app.innerHTML = `<div class="kick">Exit quiz</div><h1>${esc(quiz.title)}</h1>
      <p>Type your initials to start.</p>
      <form id="f"><input class="ini" id="ini" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(initials)}" aria-label="Your initials" placeholder="AB">
      <div style="margin-top:14px"><button class="btn big" style="width:100%">Start</button></div></form>
      <p class="note">Only your initials and answers go to your teacher. They're deleted when the quiz ends.</p>`;
    document.getElementById("ini").focus();
    document.getElementById("f").onsubmit = e => { e.preventDefault();
      const v = document.getElementById("ini").value.replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,4);
      if(!v){ document.getElementById("ini").focus(); return; }
      initials = v; sessionStorage.setItem("qr_ini", v); askQuestions(); };
  };
  const askQuestions = (msg) => {
    const done = picks.filter(x=>x!==undefined).length === quiz.questions.length;
    $app.innerHTML = `<div class="kick">Exit quiz · ${esc(initials)}</div><h1>${esc(quiz.title)}</h1>
      ${quiz.questions.map((q,i)=>`<div class="q"><p>${i+1}. ${esc(q.q)}</p><div class="opts">
        ${q.options.map((o,j)=>`<button type="button" class="opt ${picks[i]===j?"sel":""}" data-q="${i}" data-o="${j}" aria-pressed="${picks[i]===j}"><b>${L[j]}</b><span>${esc(o)}</span></button>`).join("")}</div></div>`).join("")}
      <button class="btn big" id="send" style="width:100%" ${done?"":"disabled"}>${done?"Send my answers":"Answer every question to send"}</button>
      ${msg?`<p class="err">${esc(msg)}</p>`:""}`;
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => { picks[+b.dataset.q] = +b.dataset.o; const y = scrollY; askQuestions(); scrollTo(0, y); });
    document.getElementById("send").onclick = async () => {
      const btn = document.getElementById("send"); btn.disabled = true; btn.textContent = "Sending...";
      try{
        const r = await api("submit", {room, token, initials, answers: picks});
        if(r.status === 200 && r.ok){ result = r; sessionStorage.setItem(resKey, JSON.stringify(r)); sessionStorage.setItem("qr_picks_"+room, JSON.stringify(picks)); showResult(); }
        else if(r.status === 404){ closed(); }
        else askQuestions(r.error || "Couldn't send. Try again.");
      }catch{ askQuestions("No connection. Check your Wi-Fi and try again."); }
    };
  };
  const closed = () => { $app.innerHTML = `<div class="kick">Exit quiz</div><h1>Quiz ended</h1><p>This quiz has finished. Thanks for taking part.</p>`; };
  const waiting = () => {
    $app.innerHTML = `<div class="kick">Exit quiz</div><h1 class="pulse">Waiting for your teacher</h1><p>The quiz will appear here as soon as it starts. Keep this page open.</p>`;
    clearTimeout(waitT); waitT = setTimeout(load, 4000);
  };
  async function load(){
    let r; try{ r = await api("quiz", null, "&room=" + encodeURIComponent(room)); }catch{ return waiting(); }
    if(r.status !== 200 || r.state !== "open"){ return result ? closed() : waiting(); }
    quiz = r;
    try{ picks = JSON.parse(sessionStorage.getItem("qr_picks_"+room) || "[]"); }catch{ picks = []; }
    if(result) return showResult();
    askInitials();
  }
  load();
}

/* ---------------- teacher ---------------- */
async function host(){
  let d = null;
  const m = location.hash.match(/^#d=([A-Za-z0-9_-]+)$/);
  if(m){ try{ d = JSON.parse(b64urlDecode(m[1])); sessionStorage.setItem("qr_host", JSON.stringify(d)); }catch{} history.replaceState(null, "", location.pathname + location.search); }
  if(!d){ try{ d = JSON.parse(sessionStorage.getItem("qr_host") || "null"); }catch{} }
  if(!d || !d.room || !d.secret || !d.quiz){ $app.innerHTML = `<div class="kick">Exit quiz</div><h1>No quiz to open</h1><p>Open the quiz room from the Course Creator's Exit quiz panel.</p>`; return; }
  const r = await api("open", {room: d.room, secret: d.secret, quiz: d.quiz}).catch(()=>({status:0}));
  if(r.status !== 200){ $app.innerHTML = `<div class="kick">Exit quiz</div><h1>Couldn't open the quiz</h1><p class="err">${esc(r.error || "The quiz server didn't answer. Check the address in the Course Creator settings.")}</p>`; return; }
  const joinUrl = location.origin + location.pathname.replace(/[^/]*$/, "") + "?r=" + d.room;
  let ending = false, pollT = null;
  $app.innerHTML = `<div class="kick">Exit quiz · live</div><h1>${esc(d.quiz.title || "Exit quiz")}</h1>
    <div class="host">
      <div>
        <p>Scan the code, type your initials, answer the questions.</p>
        <div class="row" style="gap:24px;align-items:flex-end"><div><div class="count" id="count">0</div><div class="note">answered</div></div></div>
        <div class="chips" id="chips"></div>
        <div class="row" style="margin-top:22px"><button class="btn end" id="end">End quiz and show report</button></div>
        <p class="note" style="margin-top:14px">Answers are kept on your server only until you end the quiz. Ending shows the report here and deletes them from the server.</p>
      </div>
      <div><div class="qr" id="qr"></div><div class="code" style="margin-top:10px">${esc(joinUrl.replace(/^https?:\/\//,""))}</div></div>
    </div>`;
  if(window.QRCode) new QRCode(document.getElementById("qr"), {text: joinUrl, width: 520, height: 520, colorDark: "#1f2f26", colorLight: "#f7f5ee", correctLevel: QRCode.CorrectLevel.M});
  else document.getElementById("qr").innerHTML = `<p style="color:#222">${esc(joinUrl)}</p>`;
  const poll = async () => {
    try{
      const s = await api("status", {room: d.room, secret: d.secret});
      if(s.status === 200){ document.getElementById("count").textContent = s.count;
        document.getElementById("chips").innerHTML = s.initials.map(x=>`<span class="chip">${esc(x)}</span>`).join(""); }
    }catch{}
    pollT = setTimeout(poll, 3000);
  };
  poll();
  const endBtn = document.getElementById("end");
  endBtn.onclick = async () => {
    if(!ending){ ending = true; endBtn.textContent = "Tap again to end the quiz"; setTimeout(()=>{ if(ending){ ending = false; endBtn.textContent = "End quiz and show report"; } }, 3500); return; }
    endBtn.disabled = true; endBtn.textContent = "Ending...";
    clearTimeout(pollT);
    const e = await api("end", {room: d.room, secret: d.secret}).catch(()=>({status:0}));
    sessionStorage.removeItem("qr_host");
    if(e.status === 200 && e.ok) report(e);
    else { $app.innerHTML = `<div class="kick">Exit quiz</div><h1>Quiz ended</h1><p>${e.status===404 ? "This quiz was already ended, so there was nothing left to report." : "Couldn't reach the quiz server to fetch the report."}</p>`; }
  };
}
let repTips = null, repTipsMsg = "";
function repStats(e){
  const qs = e.questions, rs = e.responses, n = rs.length;
  const score = r => qs.reduce((s,q,i)=>s+(r.answers[i]===q.answer?1:0),0);
  const per = qs.map((q,i)=>{ const counts = q.options.map((_,j)=>rs.filter(r=>r.answers[i]===j).length); let slip = -1; counts.forEach((c,j)=>{ if(j!==q.answer && c>0 && (slip<0 || c>counts[slip])) slip = j; });
    return {i, q, counts, slip, pct: n ? Math.round(counts[q.answer]/n*100) : 0}; });
  const missed = per.filter(p=>p.pct<100).sort((a,b)=>a.pct-b.pct||a.i-b.i);
  return {qs, rs, n, score, per, missed, avg: n ? rs.reduce((s,r)=>s+score(r),0)/n : 0};
}
/* tips the class can use: Crafticulum AI's if the teacher asked for them, otherwise built from the quiz's own explanations */
function repOwnTips(S){
  const t = S.missed.slice(0,3).filter(p=>p.q.why).map(p=>`Q${p.i+1}: ${p.q.why}`);
  if(S.missed.some(p=>p.slip>=0 && p.counts[p.slip] >= Math.max(2, S.n/3))) t.push("Where lots of us picked the same wrong answer, two options were close. Read every option before you choose, and look for the one word that makes an answer wrong.");
  t.push("Cover the options, say the answer in your own words, then find the option that matches.");
  if(S.missed.length) t.push("Before next lesson, explain the questions above to someone else. If you can teach it, you know it.");
  return t.slice(0,5);
}
async function repAskTips(e){
  const S = repStats(e);
  const prompt = `Write tips for a class after a quiz. The class has just done a short multiple-choice quiz called "${e.title}". ${S.n} learners answered. Here is each question, how many got it right, and the wrong answer picked most often. No learner is named and you must not ask who got what.\n\n` +
    S.per.map(p=>`Q${p.i+1}. ${p.q.q}\nRight answer: ${p.q.options[p.q.answer]}${p.q.why ? " (" + p.q.why + ")" : ""}\n${p.pct}% got it right.${p.slip>=0 ? ` Most common wrong answer: ${p.q.options[p.slip]} (${p.counts[p.slip]} picked it).` : ""}`).join("\n\n") +
    `\n\nWrite 3 to 5 short tips that would help this class get every question right next time. Start with the questions most got wrong, say what the likely mix-up was and how to remember the right answer. Speak to the learners ("you"), plain UK English, one or two sentences each, no names, no blame. Reply with JSON only: {"tips": ["...", "..."]}`;
  const r = await fetch("../ai.php?a=ask", {method:"POST", headers:{"Content-Type":"application/json"}, credentials:"same-origin", body: JSON.stringify({prompt, tool: "quiztips"})}).catch(()=>null);
  if(!r) throw new Error("No connection to the server.");
  let j = {}; try{ j = await r.json(); }catch{}
  if(r.status === 401) throw new Error("Sign in to Crafticulum in another tab, then press this again.");
  if(r.status === 403) throw new Error("Crafticulum AI isn't switched on for your account.");
  if(!r.ok) throw new Error(j.error && j.error !== "login" ? j.error : "Crafticulum AI didn't answer.");
  const t = String(j.text || ""), a = t.indexOf("{"), b = t.lastIndexOf("}"); let o = null; try{ o = JSON.parse(t.slice(a, b + 1)); }catch{}
  const tips = o && Array.isArray(o.tips) ? o.tips.map(x=>String(x).replace(/\s+/g," ").trim()).filter(Boolean).slice(0,5) : [];
  if(!tips.length) throw new Error("Crafticulum AI's answer couldn't be read.");
  return tips;
}
function classView(e){
  const S = repStats(e), {qs, rs, n} = S, top = qs.length;
  const spread = Array.from({length: top + 1}, (_,k)=>rs.filter(r=>S.score(r)===k).length), mx = Math.max(1, ...spread);
  const full = spread[top], pctAll = n && top ? Math.round(S.avg / top * 100) : 0;
  const used = new Set(), rows = rs.map((r,k)=>{ let nm = aliasName(r.alias); if(!nm || used.has(nm)) nm = "Player " + (k + 1); used.add(nm); return {nm, sc: S.score(r)}; }).sort((a,b)=>b.sc-a.sc||a.nm.localeCompare(b.nm));
  let all = false;
  const tips = repTips || repOwnTips(S);
  const draw = () => {
    const show = all ? rows : rows.slice(0,5); let rank = 0, last = null;
    $app.classList.add("cls");
    $app.innerHTML = `<div class="kick">Quiz results · names are made up, so nobody knows who's who</div><h1>How did we do?</h1>
      <p style="margin:0 0 6px;color:var(--dim)">${esc(e.title)}</p>
      <div class="stats"><div><div class="count">${n}</div><div class="note">of us answered</div></div>
        <div><div class="count" style="color:var(--y)">${pctAll}%</div><div class="note">right, as a class</div></div>
        <div><div class="count" style="color:var(--b)">${S.avg.toFixed(1)}<span style="font-size:.45em"> / ${top}</span></div><div class="note">average score</div></div>
        <div><div class="count">${full}</div><div class="note">got full marks</div></div></div>
      ${n ? `<div class="two"><div><h2>How the scores spread</h2>
        <div class="spread" id="spread" role="img" aria-label="${esc(spread.map((c,k)=>`${c} scored ${k}`).join(", "))}">${spread.map((c,k)=>`<div class="col ${k===top?"top":""}" title="${c} scored ${k} out of ${top}"><span>${c||""}</span><i style="height:${Math.round(c/mx*100)}%"></i></div>`).join("")}</div>
        <div class="spread-x">${spread.map((_,k)=>`<b>${k}</b>`).join("")}</div><p class="note" style="margin-top:6px">Score out of ${top}, and how many of us got it.</p></div>
        <div><h2>Leaderboard</h2><ol class="lead" id="lead">${show.map(r=>{ if(r.sc !== last){ rank = rows.findIndex(x=>x.sc===r.sc) + 1; last = r.sc; } return `<li><b>${rank}</b><span class="nm">${esc(r.nm)}</span><span class="sc">${r.sc} / ${top}</span></li>`; }).join("")}</ol>
        ${rows.length > 5 ? `<div class="row" style="margin-top:10px"><button class="btn" id="allBtn" style="font-size:15px;padding:5px 12px">${all ? "Top five only" : "Show everyone"}</button></div>` : ""}
        <p class="note" style="margin-top:8px">Your made-up name is on your phone, under your score.</p></div></div>
      <h2>${S.missed.length ? "The ones that caught us out" : "Nothing caught us out"}</h2>
      ${S.missed.length ? S.missed.slice(0,3).map(p=>`<div class="miss"><div class="hd"><b>Q${p.i+1}. ${esc(p.q.q)}</b><span class="pc">${p.pct}% right</span></div>
        ${p.slip>=0 ? `<p class="slip" style="margin:8px 0 0">Most common slip: ${L[p.slip]}) ${esc(p.q.options[p.slip])} · ${p.counts[p.slip]} of us</p>` : ""}
        <p style="margin:6px 0 0"><span class="ans">Answer: ${L[p.q.answer]}) ${esc(p.q.options[p.q.answer])}</span>${p.q.why ? ` · ${esc(p.q.why)}` : ""}</p></div>`).join("") : `<p>Every question was answered right by everyone. Full marks all round.</p>`}
      <h2>How to get them all right next time</h2>
      <ol class="tips" id="tips">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
      ${repTips ? `<p class="note">Tips written by Crafticulum AI from the class totals. It never sees who answered what.</p>` : ""}` : `<p>Nobody answered this time.</p>`}
      <div class="clsbar"><button class="btn" id="fsBtn">Full screen</button><button class="btn" id="backBtn">Back to my report</button></div>`;
    const ab = document.getElementById("allBtn"); if(ab) ab.onclick = () => { all = !all; const y = scrollY; draw(); scrollTo(0, y); };
    document.getElementById("fsBtn").onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch{} };
    document.getElementById("backBtn").onclick = () => { try{ if(document.fullscreenElement) document.exitFullscreen(); }catch{} $app.classList.remove("cls"); report(e); scrollTo(0, 0); };
  };
  draw(); scrollTo(0, 0);
}
function report(e){
  const qs = e.questions, rs = e.responses, n = rs.length;
  const score = r => qs.reduce((s,q,i)=>s+(r.answers[i]===q.answer?1:0),0);
  const avg = n ? rs.reduce((s,r)=>s+score(r),0)/n : 0;
  const per = qs.map((q,i)=>{ const counts = q.options.map((_,j)=>rs.filter(r=>r.answers[i]===j).length); const right = counts[q.answer]; return {q, counts, pct: n ? Math.round(right/n*100) : 0}; });
  const worst = per.slice().sort((a,b)=>a.pct-b.pct)[0];
  const rows = rs.slice().sort((a,b)=>score(b)-score(a)||a.initials.localeCompare(b.initials));
  const txt = [`EXIT QUIZ REPORT: ${e.title}`, `${n} answered · average ${avg.toFixed(1)} / ${qs.length}`, "",
    ...per.map((p,i)=>`Q${i+1} ${p.pct}% correct: ${p.q.q}`), "",
    ...rows.map(r=>`${r.initials}: ${score(r)}/${qs.length}`)].join("\n");
  $app.innerHTML = `<div class="kick">Exit quiz · report</div><h1>${esc(e.title)}</h1>
    <div class="row" style="gap:40px"><div><div class="count">${n}</div><div class="note">answered</div></div>
      <div><div class="count" style="color:var(--y)">${avg.toFixed(1)}<span style="font-size:.45em"> / ${qs.length}</span></div><div class="note">average score</div></div></div>
    ${n ? `<div class="callout" style="border-color:var(--y)"><b style="color:var(--y)">Share with the class</b>
      <p style="margin:6px 0 10px">Puts the results on the board with made-up names in place of initials: the scores, the questions most got wrong, and tips for next time. This page, with the initials, stays with you.</p>
      <div class="row"><button class="btn big" id="share">Show the class</button><button class="btn" id="aiTips" ${repTips ? "disabled" : ""}>${repTips ? "Crafticulum AI tips added" : "Add tips from Crafticulum AI"}</button></div>
      <p class="note" id="aiMsg" style="margin:8px 0 0">${esc(repTipsMsg || "Without them, the tips come from the quiz's own explanations. Crafticulum AI only gets the class totals, never initials.")}</p></div>` : ""}
    ${n && worst ? `<div class="callout"><b style="color:var(--p)">Go over this one:</b> Q${per.indexOf(worst)+1}. ${esc(worst.q.q)} (${worst.pct}% got it right)<br>
      Answer: <b style="color:var(--g)">${L[worst.q.answer]}) ${esc(worst.q.options[worst.q.answer])}</b>${worst.q.why?` · ${esc(worst.q.why)}`:""}</div>` : ""}
    <h2>Question by question</h2>
    ${per.map((p,i)=>`<div class="q"><p>${i+1}. ${esc(p.q.q)} <span style="color:${p.pct>=70?"var(--g)":p.pct>=40?"var(--y)":"var(--p)"}">${p.pct}%</span></p>
      ${p.q.options.map((o,j)=>`<div class="bar ${j===p.q.answer?"ok":""}"><b>${L[j]}</b><div class="t"><i style="width:${n?Math.round(p.counts[j]/n*100):0}%"></i></div><span>${p.counts[j]}</span></div>
        <div class="note" style="margin:-2px 0 4px 2.9em">${esc(o)}</div>`).join("")}
      ${p.q.why?`<div class="why">${esc(p.q.why)}</div>`:""}</div>`).join("")}
    <h2>By student</h2>
    ${n ? `<div class="tblw"><table><thead><tr><th>Initials</th>${qs.map((_,i)=>`<th>Q${i+1}</th>`).join("")}<th>Score</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.initials)}</td>${qs.map((q,i)=>{ const a=r.answers[i]; return a===q.answer?`<td class="y">✓</td>`:`<td class="n">${a==null?"–":L[a]}</td>`; }).join("")}<td><b>${score(r)}</b></td></tr>`).join("")}
    </tbody></table></div>` : `<p>Nobody answered this time.</p>`}
    <div class="row" style="margin-top:22px"><button class="btn" id="copy">Copy report</button></div>
    <p class="note" style="margin-top:12px">The answers have been deleted from the server. This report only exists in this tab, so close it when you're done and it's gone.</p>`;
  const sh = document.getElementById("share"); if(sh) sh.onclick = () => classView(e);
  const at = document.getElementById("aiTips"); if(at) at.onclick = async () => { const m = document.getElementById("aiMsg"); at.disabled = true; at.textContent = "Writing tips...";
    try{ repTips = await repAskTips(e); repTipsMsg = "Tips added. Press Show the class to see them on the board."; at.textContent = "Crafticulum AI tips added"; }
    catch(x){ repTipsMsg = "Couldn't get tips: " + (x && x.message || "try again.") + " The board will use the quiz's own explanations."; at.disabled = false; at.textContent = "Add tips from Crafticulum AI"; }
    if(m) m.textContent = repTipsMsg; };
  document.getElementById("copy").onclick = async () => {
    const b = document.getElementById("copy");
    try{ await navigator.clipboard.writeText(txt); b.textContent = "Copied"; }catch{ b.textContent = "Copy blocked"; }
    setTimeout(()=>b.textContent="Copy report", 1800);
  };
  try{ if(window.ccMarks){ let mb = document.getElementById("marksBox"); if(!mb){ mb = document.createElement("div"); mb.id = "marksBox"; $app.appendChild(mb); } window.ccMarks(e, score); } }catch(err){}
}

const room = (params.get("r") || "").toLowerCase();
if(/^[a-z0-9]{8}$/.test(room)) student(room);
else if(params.has("host")) host();
else $app.innerHTML = `<div class="kick">Exit quiz</div><h1>Scan your teacher's QR code</h1><p>Use your phone camera to scan the code on the board.</p>`;
</script>
</body>
</html>
