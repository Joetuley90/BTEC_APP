# Checks each release, then tells the live site to fetch it.
# The check runs on every push. The deploy only runs if the check passes, so a broken release never reaches the site.
# The deploy needs one repository secret, CRAFTICULUM_DEPLOY_URL: the address shown in Crafticulum under
# Settings, Site setup, Updates. Without it the check still runs and nothing is deployed.
# No passwords or keys for the server are kept here: the site fetches its own release.
name: Check and deploy Crafticulum
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release
        run: bash .github/check-release.sh
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to update
        env:
          DEPLOY_URL: ${{ secrets.CRAFTICULUM_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "CRAFTICULUM_DEPLOY_URL isn't set, so nothing was deployed."
            exit 0
          fi
          curl -fsS --max-time 240 --retry 2 --retry-delay 40 "${DEPLOY_URL}&sha=${GITHUB_SHA}"
